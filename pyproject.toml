[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "proofpay-agent"
version = "0.1.0"
description = "Custody-minimized paid delivery for ZeroClaw and Solana Pay"
requires-python = ">=3.12"
dependencies = ["cryptography>=42", "mcp>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
proofpay-mcp = "proofpay.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
